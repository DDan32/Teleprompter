<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="讀稿錄影">
<meta name="theme-color" content="#0b0d10">
<title>讀稿錄影</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230b0d10'/%3E%3Crect x='34' y='40' width='112' height='10' rx='5' fill='%23f2c14e'/%3E%3Crect x='34' y='62' width='84' height='10' rx='5' fill='%23e8e6e1'/%3E%3Crect x='34' y='84' width='100' height='10' rx='5' fill='%23e8e6e1' opacity='.5'/%3E%3Ccircle cx='90' cy='134' r='18' fill='%23ff4a3d'/%3E%3C/svg%3E">
<style>
/* 單一深色介面：鏡頭預覽滿版，讀稿區貼在螢幕最上方（最靠近前鏡頭） */
:root{
  --bg:#0b0d10; --ink:#f4f2ec; --dim:#9aa0a8; --cue:#f2c14e; --rec:#ff4a3d; --glass:rgba(11,13,16,.72);
  --ui:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cue);outline-offset:2px}

#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#cam.mirror{transform:scaleX(-1)}

/* 讀稿區 */
#prompter{position:fixed;left:0;right:0;top:0;height:var(--ph,36%);
  padding-top:env(safe-area-inset-top,0px);
  background:linear-gradient(to bottom,rgba(0,0,0,var(--shade,.62)) 70%,rgba(0,0,0,0));
  overflow:hidden;touch-action:none}
#track{position:absolute;left:0;right:0;top:0;will-change:transform;
  padding:0 max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px))}
#text{margin:0;white-space:pre-wrap;word-break:break-word;font-size:var(--fs,30px);line-height:1.45;font-weight:600;
  letter-spacing:.02em;text-shadow:0 1px 3px rgba(0,0,0,.8)}
#text.flip{transform:scaleX(-1)}
#cueline{position:absolute;left:6px;width:8px;height:3px;border-radius:2px;background:var(--cue);
  top:calc(env(safe-area-inset-top,0px) + var(--cue-y,48px))}
#prompter::after{content:"";position:absolute;inset:auto 0 0;height:28%;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,0))}
#paused{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:10px;font-size:12px;
  color:var(--dim);background:var(--glass);padding:4px 10px;border-radius:999px}

/* 底部控制列 */
#bar{position:fixed;left:0;right:0;bottom:0;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,rgba(0,0,0,.7),rgba(0,0,0,0));
  display:grid;gap:12px}
.sliders{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;font-size:13px;color:var(--dim)}
.sliders output{min-width:2.5em;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--cue)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--dim);min-width:56px}
.tool svg{width:26px;height:26px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool[aria-pressed=true] svg{stroke:var(--cue)}
#recBtn{width:74px;height:74px;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;flex:none}
#recBtn i{display:block;width:56px;height:56px;border-radius:50%;background:var(--rec);transition:all .2s}
#recBtn.on i{width:28px;height:28px;border-radius:6px}
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(196px + env(safe-area-inset-bottom,0px));
  background:var(--rec);color:#fff;font-size:14px;font-variant-numeric:tabular-nums;padding:4px 12px;border-radius:999px}
#count{position:fixed;inset:0;display:grid;place-items:center;font-size:120px;font-weight:700;color:var(--ink);
  text-shadow:0 4px 20px rgba(0,0,0,.6);pointer-events:none}

/* 全畫面面板 */
.sheet{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:12px}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet h2{margin:0;font-size:17px}
.pill{background:var(--cue);color:#14110a;font-weight:600;padding:8px 16px;border-radius:999px}
.ghost{color:var(--dim);padding:8px 4px}
textarea{flex:1;width:100%;resize:none;background:#15181d;color:var(--ink);border:1px solid #262a31;border-radius:12px;
  padding:14px;font:500 17px/1.6 var(--ui);-webkit-user-select:text;user-select:text}
.hint{font-size:13px;color:var(--dim);margin:0;line-height:1.5}
.opts{display:grid;gap:10px;font-size:14px}
.opts label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #1e2228}
#result video{width:100%;flex:1;min-height:0;object-fit:contain;background:#000;border-radius:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions button{padding:14px;border-radius:12px;background:#1b1f25;font-weight:600}
.actions .pill{border-radius:12px}

#gate{position:fixed;inset:0;display:grid;place-items:center;padding:24px max(24px,env(safe-area-inset-left,0px));text-align:center;background:var(--bg)}
#gate div{max-width:340px;display:grid;gap:16px}
#gate h1{margin:0;font-size:24px}
#gate p{margin:0;color:var(--dim);line-height:1.6;font-size:15px}
@media (prefers-reduced-motion:reduce){#recBtn i{transition:none}}
</style>
</head>
<body>

<video id="cam" playsinline muted autoplay class="mirror"></video>

<section id="prompter" aria-label="讀稿區">
  <div id="track"><p id="text"></p></div>
  <span id="cueline" aria-hidden="true"></span>
  <span id="paused">點一下開始捲動</span>
</section>

<div id="timer" hidden>00:00</div>
<div id="count" hidden></div>

<nav id="bar">
  <div class="sliders">
    <span>速度</span><input id="speed" type="range" min="5" max="120" step="1"><output id="speedOut"></output>
    <span>字級</span><input id="size" type="range" min="18" max="64" step="1"><output id="sizeOut"></output>
  </div>
  <div class="row">
    <button class="tool" id="editBtn" aria-label="編輯稿子"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>稿子</button>
    <button class="tool" id="resetBtn" aria-label="回到開頭"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg>從頭</button>
    <button id="recBtn" aria-label="開始錄影"><i></i></button>
    <button class="tool" id="flipBtn" aria-label="切換鏡頭"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><path d="M9 13a3 3 0 0 1 5.6-1.5M15 14a3 3 0 0 1-5.6 1.5"/></svg>鏡頭</button>
    <button class="tool" id="setBtn" aria-label="設定"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>設定</button>
  </div>
</nav>

<section class="sheet" id="editor" hidden aria-label="編輯稿子">
  <header><button class="ghost" id="clearBtn">清空</button><h2>稿子</h2><button class="pill" id="doneBtn">完成</button></header>
  <textarea id="script" placeholder="把講稿貼在這裡"></textarea>
  <p class="hint">稿子只存在這支手機的瀏覽器裡。空一行可以讓段落之間多一點呼吸。</p>
</section>

<section class="sheet" id="settings" hidden aria-label="設定">
  <header><span></span><h2>設定</h2><button class="pill" id="setDone">完成</button></header>
  <div class="opts">
    <label>讀稿區高度 <input id="height" type="range" min="20" max="60" step="1" style="max-width:55%"></label>
    <label>背景遮罩 <input id="shade" type="range" min="0" max="90" step="5" style="max-width:55%"></label>
    <label>錄影時自動開始捲動 <input id="autoScroll" type="checkbox"></label>
    <label>錄影前倒數 3 秒 <input id="countdown" type="checkbox"></label>
    <label>文字左右鏡像（配合提詞器玻璃） <input id="mirrorText" type="checkbox"></label>
  </div>
  <p class="hint">眼睛盯著黃色小標記那一行唸，視線會最接近鏡頭。讀稿區越矮，眼神越不會往下飄。</p>
</section>

<section class="sheet" id="result" hidden aria-label="錄好的影片">
  <header><span></span><h2>錄好了</h2><span></span></header>
  <video id="playback" playsinline controls></video>
  <div class="actions">
    <button id="discardBtn">重錄</button>
    <button class="pill" id="saveBtn">儲存影片</button>
  </div>
  <p class="hint" id="saveHint">點「儲存影片」後選「儲存影片」就會存進照片。</p>
</section>

<section id="gate">
  <div>
    <h1>讀稿錄影</h1>
    <p>稿子顯示在螢幕最上方，靠近前鏡頭，一邊唸一邊錄。</p>
    <button class="pill" id="startBtn" style="padding:14px">開啟鏡頭</button>
    <p id="gateMsg"></p>
  </div>
</section>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d){ try{ const v = localStorage.getItem('tp_'+k); return v===null ? d : JSON.parse(v); }catch{ return d; } },
    set(k, v){ try{ localStorage.setItem('tp_'+k, JSON.stringify(v)); }catch{} }
  };
  const SAMPLE = `大家好，歡迎來到這一集。

今天想跟你聊一件很實際的事：怎麼在鏡頭前講話，看起來不像在念稿。

秘訣其實很簡單。把稿子放在最靠近鏡頭的地方，視線就不會一直往下掉。

再來，速度放慢一點。觀眾聽得比你想像的慢。

好，我們開始吧。`;

  const cfg = {
    script: store.get('script', SAMPLE),
    speed: store.get('speed', 35),
    size: store.get('size', 30),
    height: store.get('height', 34),
    shade: store.get('shade', 60),
    autoScroll: store.get('autoScroll', true),
    countdown: store.get('countdown', true),
    mirrorText: store.get('mirrorText', false),
  };
  const save = k => store.set(k, cfg[k]);

  // ---------- 讀稿捲動 ----------
  const track = $('track'), text = $('text'), prompter = $('prompter');
  let y = 0, playing = false, last = 0;
  function applyLook(){
    document.documentElement.style.setProperty('--fs', cfg.size+'px');
    document.documentElement.style.setProperty('--ph', cfg.height+'%');
    document.documentElement.style.setProperty('--shade', (cfg.shade/100).toFixed(2));
    document.documentElement.style.setProperty('--cue-y', (cfg.size*0.75)+'px');
    text.classList.toggle('flip', cfg.mirrorText);
    $('speedOut').textContent = cfg.speed;
    $('sizeOut').textContent = cfg.size;
  }
  function render(){ track.style.transform = `translateY(${-y}px)`; }
  function maxY(){ return Math.max(0, track.scrollHeight - cfg.size*1.5); }
  function setPlaying(p){
    playing = p; $('paused').hidden = p;
    $('paused').textContent = y >= maxY() ? '已到結尾，點「從頭」重來' : '點一下繼續捲動';
    if (p){ last = performance.now(); requestAnimationFrame(tick); }
  }
  function tick(t){
    if (!playing) return;
    const dt = Math.min(0.1, (t-last)/1000); last = t;
    y += cfg.speed * dt * (cfg.size/30);
    if (y >= maxY()){ y = maxY(); render(); setPlaying(false); return; }
    render(); requestAnimationFrame(tick);
  }
  text.textContent = cfg.script;

  // 點一下暫停／繼續，拖曳手動調整位置
  let drag = null;
  prompter.addEventListener('pointerdown', e => { drag = {sy:e.clientY, y0:y, moved:false}; prompter.setPointerCapture(e.pointerId); });
  prompter.addEventListener('pointermove', e => {
    if (!drag) return;
    const d = drag.sy - e.clientY;
    if (Math.abs(d) > 6) drag.moved = true;
    if (drag.moved){ y = Math.min(maxY(), Math.max(0, drag.y0 + d)); render(); }
  });
  prompter.addEventListener('pointerup', () => {
    if (drag && !drag.moved) setPlaying(!playing);
    drag = null;
  });

  // ---------- 控制項 ----------
  const bind = (id, key, num=true) => {
    const el = $(id);
    if (el.type === 'checkbox'){ el.checked = cfg[key]; el.onchange = () => { cfg[key] = el.checked; save(key); applyLook(); }; }
    else { el.value = cfg[key]; el.oninput = () => { cfg[key] = num ? +el.value : el.value; save(key); applyLook(); }; }
  };
  bind('speed','speed'); bind('size','size'); bind('height','height'); bind('shade','shade');
  bind('autoScroll','autoScroll'); bind('countdown','countdown'); bind('mirrorText','mirrorText');
  applyLook();

  $('resetBtn').onclick = () => { y = 0; render(); setPlaying(false); $('paused').textContent = '點一下開始捲動'; };
  $('editBtn').onclick = () => { setPlaying(false); $('script').value = cfg.script; $('editor').hidden = false; };
  $('clearBtn').onclick = () => { $('script').value = ''; $('script').focus(); };
  $('doneBtn').onclick = () => {
    cfg.script = $('script').value; save('script');
    text.textContent = cfg.script || '（還沒有稿子，點「稿子」貼上）';
    y = 0; render(); $('editor').hidden = true;
  };
  $('setBtn').onclick = () => { setPlaying(false); $('settings').hidden = false; };
  $('setDone').onclick = () => { $('settings').hidden = true; };

  // ---------- 鏡頭 ----------
  const cam = $('cam');
  let stream = null, facing = 'user';
  async function openCam(){
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:facing, width:{ideal:1920}, height:{ideal:1080}, frameRate:{ideal:30} },
      audio:{ echoCancellation:true, noiseSuppression:true }
    });
    cam.srcObject = stream;
    cam.classList.toggle('mirror', facing === 'user');
    await cam.play().catch(()=>{});
  }
  $('startBtn').onclick = async () => {
    if (!navigator.mediaDevices?.getUserMedia){
      $('gateMsg').textContent = '這個瀏覽器不能使用鏡頭。請用 Safari 打開 https 網址。'; return;
    }
    try{ await openCam(); $('gate').hidden = true; keepAwake(); }
    catch(e){ $('gateMsg').textContent = '沒有拿到鏡頭或麥克風權限。到「設定 › Safari › 相機／麥克風」改成允許，再重新整理。'; }
  };
  $('flipBtn').onclick = async () => {
    if (recorder) return;
    facing = facing === 'user' ? 'environment' : 'user';
    try{ await openCam(); }catch{ facing = 'user'; await openCam().catch(()=>{}); }
  };

  // 螢幕不自動變暗
  let lock = null;
  async function keepAwake(){ try{ lock = await navigator.wakeLock?.request('screen'); }catch{} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

  // ---------- 錄影 ----------
  let recorder = null, chunks = [], blob = null, t0 = 0, timerId = 0;
  const pickType = () => ['video/mp4;codecs=avc1,mp4a','video/mp4','video/webm;codecs=vp9,opus','video/webm']
    .find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
  const wait = ms => new Promise(r => setTimeout(r, ms));

  $('recBtn').onclick = async () => {
    if (recorder){ recorder.stop(); return; }
    if (!stream) return;
    if (cfg.countdown){
      const c = $('count'); c.hidden = false;
      for (const n of [3,2,1]){ c.textContent = n; await wait(1000); }
      c.hidden = true;
    }
    chunks = [];
    const type = pickType();
    recorder = new MediaRecorder(stream, type ? {mimeType:type, videoBitsPerSecond:8e6} : undefined);
    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = finish;
    recorder.start(1000);
    $('recBtn').classList.add('on'); $('recBtn').setAttribute('aria-label','停止錄影');
    $('flipBtn').disabled = true;
    t0 = Date.now(); $('timer').hidden = false; $('timer').textContent = '00:00';
    timerId = setInterval(() => {
      const s = Math.floor((Date.now()-t0)/1000);
      $('timer').textContent = String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
    }, 250);
    if (cfg.autoScroll) setPlaying(true);
  };

  function finish(){
    clearInterval(timerId); $('timer').hidden = true;
    $('recBtn').classList.remove('on'); $('recBtn').setAttribute('aria-label','開始錄影');
    $('flipBtn').disabled = false;
    setPlaying(false);
    blob = new Blob(chunks, {type: recorder.mimeType || 'video/mp4'});
    recorder = null;
    const pb = $('playback');
    if (pb.src) URL.revokeObjectURL(pb.src);
    pb.src = URL.createObjectURL(blob);
    $('result').hidden = false;
  }

  function fileName(){
    const d = new Date(), p = n => String(n).padStart(2,'0');
    const ext = (blob.type.includes('mp4') ? 'mp4' : 'webm');
    return `讀稿錄影_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.${ext}`;
  }
  $('saveBtn').onclick = async () => {
    const file = new File([blob], fileName(), {type: blob.type});
    if (navigator.canShare?.({files:[file]})){
      try{ await navigator.share({files:[file]}); return; }catch(e){ if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    $('saveHint').textContent = '已下載。iPhone 會放在「檔案 › 下載項目」，可以從那裡存到照片。';
  };
  $('discardBtn').onclick = () => {
    $('playback').pause(); $('result').hidden = true;
    y = 0; render(); $('paused').textContent = '點一下開始捲動'; $('paused').hidden = false;
  };
})();
</script>
</body>
</html>
